info:
  name: Suche id, version, ... von Nutzern mit Nachnamen
  type: graphql
  seq: 5

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: nachnamo
      value: "{{currentNachname}}"
  body:
    query: |-
      {
        nutzerListe(suchparameter: {nachname: "{{currentNachname}}"}) {
          id
          nachname
          email
        }
      }
