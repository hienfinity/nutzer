runtime:
  scripts:
    - type: after-response
      code: |-
        const expected = bru.getVar('currentNachname')?.toLowerCase();
        test('Body: Nachname enthaelt aktuellen Nachnamen', () => {
          res.getBody().data.nutzerListe.forEach(nutzer => {
            expect(nutzer.nachname.toLowerCase()).to.contain(expected);
          });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.errors
      operator: isEmpty
    - expression: res.body.data.nutzerListe
      operator: isArray
    - expression: res.body.data.nutzerListe
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
