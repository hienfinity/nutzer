info:
  name: Nicht-vorhandene ID 999999
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    query: |-
      {
        nutzer(nutzerId: "999999") {
          nachname
        }
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.errors
      operator: isEmpty
    - expression: res.body.data.nutzer
      operator: isNull

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
