info:
  name: Suche id, version, ... von Nutzern mit der Emailadresse
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    query: |-
      {
        nutzerListe(suchparameter: {email: "{{currentEmail}}"}) {
          id
          vorname
          nachname
          email
        }
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.errors
      operator: isEmpty
    - expression: res.body.data.nutzerListe[0].email
      operator: eq
      value: "{{currentEmail}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
