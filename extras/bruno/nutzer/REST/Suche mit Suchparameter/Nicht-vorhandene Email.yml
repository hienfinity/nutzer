info:
  name: Nicht-vorhandene Email
  type: http
  seq: 4

http:
  method: GET
  url: "{{restUrl}}?email=nicht@vorhanden.de"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Accept
      value: application/json
  params:
    - name: email
      value: nicht@vorhanden.de
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
