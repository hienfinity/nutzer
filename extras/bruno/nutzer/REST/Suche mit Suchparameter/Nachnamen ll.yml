info:
  name: Nachnamen mit Teilstring son
  type: http
  seq: 6

http:
  method: GET
  url: "{{restUrl}}/nachnamen/son"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Accept
      value: application/json

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Body: alle Nachnamen enthalten son', () => {
          res.getBody().forEach(nachname => {
            expect(nachname.toLowerCase()).to.contain('son');
          });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray
    - expression: res.body
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
