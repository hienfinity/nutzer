runtime:
  scripts:
    - type: after-response
      code: |-
        const etag = res.headers.etag || res.headers.ETag;
        if (etag) {
          bru.setVar('currentVersionQuoted', etag);
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "{{createdNutzerId}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
