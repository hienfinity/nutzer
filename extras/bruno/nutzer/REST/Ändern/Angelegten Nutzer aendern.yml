info:
  name: Angelegten Nutzer aendern
  type: http
  seq: 1

http:
  method: PUT
  url: "{{restUrl}}/:id"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: If-Match
      value: "{{currentVersionQuoted}}"
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "{{createdNutzerId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "vorname": "Alicia",
        "nachname": "{{updatedNachname}}",
        "email": "{{updatedEmail}}",
        "telefonnummer": "654321",
        "geburtsdatum": "2022-01-09",
        "beitrittsdatum": "2024-01-09",
        "aktiv": false,
        "rolle": "NUTZER",
        "status": "AKTIV"
      }
  auth:
    type: bearer
    token: eyJhbGciOiJSUzI1NiIsInR5cCIgOiAiSldUIiwia2lkIiA6ICJrdVd0aHRLT0o2T2NtTnl4bG4xT1p2ZlJoUk5MX1ZCaEZuckhkeDdycTYwIn0..f7MUwzNKUs9fC_sUYrxttPQouMH6-TxNCJ0VZ760ns2ZrZ0fUiyr4XpF7gcp8oTFBqQRqjiNEM6knfeDuJF3bcw1Whfeyo6s-ZJqbiJBjSQL_xamsTnVIQkI6xQd6lZJMovxakRjYM-CwcolckyfsmAWW-e1L6vxaq36MHHZL0WKh1OJ4kSZHGZ7PPKPgALlfLP-BNEzsgpwNXQseqr7HIQWjNhCxkh1mQIm7Nwvr8CEl0AUTnnjVjb2mOG75NOG7m59nUQzHNJN5dhMZMXv1CiI2RSr2gCdNm37NwHhRlf6OIkvuCHExbXsc7zcz1ZByRhUn6R2wcBN2IYXt9b5_g

runtime:
  scripts:
    - type: before-request
      code: |-
        const id = bru.getVar('createdNutzerId') || '20';
        const suffix = id.toString();
        bru.setVar('updatedEmail', `bruno.updated.${suffix}@example.de`);
        bru.setVar('updatedNachname', `Brunoupdate${suffix}`);
        const token = bru.getVar('token');
        if (!token) {
          throw new Error('Kein Token vorhanden. Bitte zuerst den Login-Request ausfuehren.');
        }
        const restUrl = bru.interpolate('{{restUrl}}');
        const getUrl = `${restUrl}/${id}`;

        const lookupResponse = await bru.sendRequest({
          method: 'GET',
          url: getUrl,
          headers: {
            Authorization: `Bearer ${token}`,
          },
        });

        if (!lookupResponse || lookupResponse.status !== 200) {
          throw new Error(`Vorab-GET fuer Nutzer ${id} fehlgeschlagen. Status: ${lookupResponse?.status}`);
        }

        const etagHeader = lookupResponse?.headers?.etag || lookupResponse?.headers?.ETag;
        const version = lookupResponse?.data?.version;
        const etag = etagHeader || (version !== undefined && version !== null ? `"${version}"` : null);

        if (!etag) {
          throw new Error(`Keine Versionsinformation fuer Nutzer ${id} gefunden.`);
        }

        bru.setVar('currentVersionQuoted', etag);
        req.setHeader('Authorization', `Bearer ${token}`);
        req.setHeader('If-Match', etag);
        req.setHeader('Content-Type', 'application/json');
    - type: after-response
      code: |-
        const etag = res.headers.etag || res.headers.ETag;
        if (etag) {
          bru.setVar('currentVersionQuoted', etag);
        }
        if (res.status === 204) {
          bru.setVar('currentEmail', bru.getVar('updatedEmail'));
          bru.setVar('currentNachname', bru.getVar('updatedNachname'));
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
    - expression: res.body
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
